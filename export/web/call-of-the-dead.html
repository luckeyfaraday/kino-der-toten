<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call of the Dead</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #23313d; }
    body { color: #e6ebef; font: 12px/1.6 system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status, #help, #error { position: fixed; z-index: 1; margin: 0; padding: 8px 12px; background: #121a22ba; border-radius: 3px; }
    #status { left: 16px; top: 16px; pointer-events: none; }
    #help { bottom: 16px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); text-align: center; pointer-events: none; transition: opacity .25s; }
    #help.quiet { opacity: 0; }
    #error { left: 16px; top: 60px; max-width: calc(100% - 32px); color: #ffc4bb; }
    [hidden] { display: none !important; }
  </style>
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/","three-mesh-bvh":"./vendor/bvh.js"}}
  </script>
</head>
<body>
  <p id="status" role="status">Loading Call of the Dead…</p>
  <p id="help">Click the map to look around · WASD move · Shift sprint · Space jump · Ctrl crouch · V fly · R return · Esc release</p>
  <p id="error" role="alert" hidden></p>
  <noscript>This map requires JavaScript and WebGL.</noscript>
  <script type="module" src="./call-of-the-dead.js"></script>
</body>
</html>
